version: '3.8'

services:
  backend:
    image: seatsprint-backend:latest
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env.prod
    environment:
      - DJANGO_ENV=production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: seatsprint-backend:latest
    restart: unless-stopped
    command: celery -A config worker --loglevel=warning
    env_file: .env.prod
    environment:
      - DJANGO_ENV=production
    depends_on:
      - db
      - redis

  celery_beat:
    image: seatsprint-backend:latest
    restart: unless-stopped
    command: celery -A config beat --loglevel=warning
    env_file: .env.prod
    environment:
      - DJANGO_ENV=production
    depends_on:
      - db
      - redis

  nginx:
    image: seatsprint-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - mysql_data_prod:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql_data_prod:
  static_volume:
  media_volume:
